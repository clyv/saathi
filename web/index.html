<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>साथी</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23f2a541'/%3E%3Cpath d='M20 38c4 6 20 6 24 0' stroke='%23402218' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='27' r='3.5' fill='%23402218'/%3E%3Ccircle cx='40' cy='27' r='3.5' fill='%23402218'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/call.css">
</head>
<body class="size-large">
  <main class="call" id="call">
    <header class="topbar">
      <div class="who">
        <span class="live-dot" aria-hidden="true"></span>
        <span id="companionName">साथी</span>
        <span class="timer" id="timer">00:00</span>
      </div>
      <div class="privacy" title="Gemma, Whisper and Piper all run on this laptop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V8a5 5 0 0 1 10 0v2h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h1Zm2 0h6V8a3 3 0 0 0-6 0v2Z"/></svg>
        <span>सब कुछ इसी लैपटॉप पर</span>
      </div>
    </header>

    <section class="stage">
      <div class="avatar-wrap" id="avatarWrap" data-phase="precall">
        <div class="ring" id="ring"></div>
        <svg class="avatar bhaiya" id="avatar" viewBox="0 0 240 240" role="img" aria-label="साथी का चेहरा">
          <defs>
            <radialGradient id="bg" cx="50%" cy="40%" r="70%">
              <stop offset="0%" stop-color="#ffe1b0"/>
              <stop offset="100%" stop-color="#f2a541"/>
            </radialGradient>
            <clipPath id="circle"><circle cx="120" cy="120" r="118"/></clipPath>
          </defs>
          <g clip-path="url(#circle)">
            <circle cx="120" cy="120" r="120" fill="url(#bg)"/>
            <!-- shoulders -->
            <path class="kurta" d="M30 240c6-46 40-70 90-70s84 24 90 70Z"/>
            <path class="dupatta only-didi" d="M48 240c10-40 30-58 52-64l-8 64Z"/>
            <path class="collar only-bhaiya" d="M104 172l16 20 16-20" fill="none" stroke="#fff6e8" stroke-width="5" stroke-linejoin="round"/>
            <rect x="104" y="150" width="32" height="30" rx="10" class="skin"/>
            <!-- hair behind -->
            <circle class="hair only-didi" cx="120" cy="52" r="22"/>
            <path class="hair only-didi" d="M60 112c0-46 26-74 60-74s60 28 60 74c0 22-6 40-10 48-2-34-12-58-50-62-38 4-48 28-50 62-4-8-10-26-10-48Z"/>
            <!-- ears -->
            <ellipse class="skin" cx="66" cy="118" rx="9" ry="14"/>
            <ellipse class="skin" cx="174" cy="118" rx="9" ry="14"/>
            <circle class="earring only-didi" cx="66" cy="134" r="4"/>
            <circle class="earring only-didi" cx="174" cy="134" r="4"/>
            <!-- face -->
            <ellipse class="skin" cx="120" cy="114" rx="52" ry="60"/>
            <!-- hair front -->
            <path class="hair only-didi" d="M70 104c4-32 22-52 50-54 28 2 46 22 50 54-12-14-30-24-50-26-20 2-38 12-50 26Z"/>
            <path class="hair only-bhaiya" d="M68 108c-2-40 22-62 52-62s54 22 52 62c-6-18-18-28-28-32-8 8-30 10-50 6-12 6-20 14-26 26Z"/>
            <!-- brows -->
            <path class="brow" d="M86 96q12-7 24-2"/>
            <path class="brow" d="M130 94q12-5 24 2"/>
            <!-- eyes -->
            <g class="eyes">
              <ellipse cx="98" cy="112" rx="7" ry="8" fill="#2b1a12"/>
              <ellipse cx="142" cy="112" rx="7" ry="8" fill="#2b1a12"/>
              <circle cx="100" cy="109" r="2.2" fill="#fff"/>
              <circle cx="144" cy="109" r="2.2" fill="#fff"/>
              <rect class="lid" x="88" y="102" width="20" height="20" rx="8"/>
              <rect class="lid" x="132" y="102" width="20" height="20" rx="8"/>
            </g>
            <circle class="bindi only-didi" cx="120" cy="92" r="4"/>
            <path class="nose" d="M120 116q-6 14 0 18q4 1 6-1"/>
            <!-- mouth: JS sets the inner ellipse height while speaking -->
            <g class="mouth">
              <path id="smile" d="M104 146q16 12 32 0" fill="none" stroke="#7a2e22" stroke-width="4" stroke-linecap="round"/>
              <ellipse id="mouthOpen" cx="120" cy="148" rx="13" ry="0" fill="#5a1f17"/>
            </g>
            <ellipse class="cheek" cx="84" cy="134" rx="9" ry="5"/>
            <ellipse class="cheek" cx="156" cy="134" rx="9" ry="5"/>
            <path class="moustache only-bhaiya" d="M104 140q8-6 16-2q8-4 16 2q-8 3-16 0q-8 3-16 0Z"/>
          </g>
        </svg>
        <!-- what she showed on the camera, pinned beside the face while Saathi talks about it -->
        <img class="shown" id="shownPhoto" alt="आपने जो दिखाया" hidden>
      </div>

      <p class="status" id="status" aria-live="polite">&nbsp;</p>

      <div class="captions" aria-live="polite">
        <p class="you" id="youCaption"></p>
        <p class="saathi" id="saathiCaption"></p>
      </div>
    </section>

    <nav class="dock" aria-label="बटन">
      <button class="btn mic" id="micBtn" disabled>
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm6-3a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.9V20H8a1 1 0 1 0 0 2h8a1 1 0 1 0 0-2h-3v-2.1a6 6 0 0 0 5-5.9Z"/></svg></span>
        <span class="label" id="micLabel">बोलिए</span>
      </button>
      <button class="btn" id="showBtn" disabled hidden>
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M9 4h6l1.6 2H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3.4L9 4Zm3 4.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Zm0 2a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z"/></svg></span>
        <span class="label">दिखाइए</span>
      </button>
      <button class="btn" id="typeBtn" disabled>
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M4 6h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Zm1 3v2h2V9H5Zm4 0v2h2V9H9Zm4 0v2h2V9h-2Zm4 0v2h2V9h-2ZM7 13v2h10v-2H7Z"/></svg></span>
        <span class="label">लिखिए</span>
      </button>
      <button class="btn" id="repeatBtn" disabled>
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"/></svg></span>
        <span class="label">फिर से सुनिए</span>
      </button>
      <button class="btn end" id="endBtn" disabled>
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 9c-2.6 0-5 .5-7.2 1.4a2 2 0 0 0-1.2 1.9v2.1a1 1 0 0 0 1.2 1l3.5-.7a1 1 0 0 0 .8-1v-1.8a13 13 0 0 1 5.8 0v1.8a1 1 0 0 0 .8 1l3.5.7a1 1 0 0 0 1.2-1v-2.1a2 2 0 0 0-1.2-1.9C17 9.5 14.6 9 12 9Z"/></svg></span>
        <span class="label">कॉल खत्म</span>
      </button>
    </nav>

    <a class="family-link" href="/family" id="familyLink">परिवार के लिए सेटिंग</a>
  </main>

  <!-- Before the call: one big button (browsers need a tap before they allow sound and the microphone) -->
  <div class="overlay" id="precall">
    <div class="sheet">
      <p class="hello" id="helloText">नमस्ते!</p>
      <p class="sub" id="helloSub">बात करने के लिए हरा बटन दबाइए</p>
      <button class="big-green" id="startBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1Z"/></svg>
        बात शुरू करें
      </button>
      <p class="ready" id="readyNote" aria-live="polite"></p>
      <p class="setup-warning" id="setupWarning" hidden></p>
    </div>
  </div>

  <!-- "दिखाइए": she holds something up to the laptop camera; it takes the picture by itself -->
  <div class="overlay camera-overlay" id="camera" hidden>
    <div class="camera-sheet">
      <p class="camera-hint">जो दिखाना है, कैमरे के सामने रखिए</p>
      <div class="viewfinder">
        <video id="camVideo" autoplay playsinline muted></video>
        <span class="countdown" id="countdown"></span>
        <span class="flash" id="flash"></span>
      </div>
      <div class="camera-actions">
        <button type="button" class="plain" id="camCancel">रहने दीजिए</button>
        <button type="button" class="big-button" id="camTake">अभी लीजिए</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="ended" hidden>
    <div class="sheet">
      <p class="hello">फिर बात करेंगे 🙏</p>
      <p class="sub">जब मन करे, यह बटन दबाइए।</p>
      <button class="big-green" id="againBtn">फिर से बात करें</button>
    </div>
  </div>

  <div class="overlay alert-overlay" id="alert" hidden>
    <div class="sheet alert-card" id="alertCard">
      <p class="alert-title" id="alertTitle"></p>
      <p class="alert-body" id="alertBody"></p>
      <p class="alert-phone" id="alertPhone"></p>
      <button class="big-button" id="alertClose">ठीक है</button>
    </div>
  </div>

  <dialog id="typeDialog">
    <form method="dialog" class="type-form" id="typeForm">
      <label for="typeInput">जो कहना है, यहाँ लिखिए</label>
      <textarea id="typeInput" rows="3" lang="hi" autocomplete="off"></textarea>
      <div class="type-actions">
        <button type="button" id="typeCancel" class="plain">रहने दीजिए</button>
        <button type="submit" class="big-button">भेजिए</button>
      </div>
    </form>
  </dialog>

  <script src="/static/call.js"></script>
</body>
</html>
